<script>
'use strict';
/* =========================== Prompt engine =========================== */
const priceLabel = p => ({ budget: 'value-driven', value: 'great-value', mid: 'mid-market', premium: 'premium', luxury: 'luxury' })[p] || 'contemporary';
const UNK = '[UNKNOWN — ask me before assuming]';
function palette(b) {
  let cs = (b.a.colors || []).map(Color.norm).filter(Boolean);
  if (!cs.length && b.logo) cs = b.logo.palette.map(p => p.hex);
  return [...new Set(cs)];
}
function colorRoles(b) {
  const cs = palette(b);
  const chrom = cs.filter(c => !['black', 'white', 'gray'].includes(Color.family(c)));
  const primary = chrom[0] || cs[0] || '#1D1D1F';
  const secondary = chrom[1] || null;
  const dark = cs.find(c => Color.isNeutral(c) && Color.lum(c) < .08) || cs.find(c => Color.lum(c) < .015) || '#111114';
  const light = cs.find(c => Color.isNeutral(c) && Color.lum(c) > .6) || Color.tint(primary, .975, .008);
  const accent = chrom.find(c => c !== primary && Color.dist(c, primary) > 40) || null;
  return { primary, secondary, accent, dark, light, all: cs };
}
const colorText = h => `${Color.name(h)} ${h}`;
function moodWords(b) {
  const out = [], sl = b.a.sliders || {};
  SLIDERS.forEach(s => { const v = sl[s.k]; if (v == null) return; if (v >= 65) out.push(s.hi); else if (v <= 35) out.push(s.lo); });
  (b.a.archetypes || []).slice(0, 2).forEach(id => { const ar = ARCH(id); if (ar) out.push(ar.voice); });
  if (b.a.price === 'luxury') out.push('quietly luxurious'); else if (b.a.price === 'premium') out.push('premium and considered');
  if (!out.length) out.push('confident, clean, contemporary');
  return [...new Set(out.join(', ').split(/,\s*/))].slice(0, 9).join(', ');
}
function lighting(b) {
  return ({
    luxury: 'low-key sculpted lighting — one large softbox key at 45° with black negative fill, a thin strip-light rim for edge definition, deep yet detailed shadows and controlled specular highlights',
    premium: 'soft directional key from a large octabox at 45°, gentle bounce fill, subtle rim light separating the subject from the background, smooth gradient fall-off',
    mid: 'bright, clean high-key lighting: large diffused overhead key, white fill cards both sides, soft contact shadow',
    value: 'bright, even, daylight-balanced lighting with lively colour and crisp detail',
    budget: 'bright, cheerful, even daylight-balanced lighting with lively colour and crisp detail'
  })[b.a.price] || 'soft directional key from a large octabox at 45°, gentle bounce fill and a subtle rim light';
}
function colorGrade(b) {
  const s = b.a.sliders || {};
  if (b.a.price === 'luxury' || (s.exclusive ?? 50) > 70) return 'rich, deep blacks, warm neutral highlights, restrained saturation';
  if ((s.serious ?? 50) < 35) return 'bright, saturated, clean whites, joyful colour';
  if ((s.expressive ?? 50) < 35) return 'soft, airy, low-contrast grade with clean neutrals';
  if ((s.bold ?? 50) > 65) return 'punchy contrast with saturated brand colour and deep shadows';
  return 'natural, true-to-life colour with gentle contrast';
}
function modelFor(b) {
  const age = (b.a.age || [])[0];
  if (age === 'Under 18') return 'a parent and child sharing a natural, candid moment';
  const band = { '18–24': 'in their early twenties', '25–34': 'in their late twenties', '35–44': 'in their late thirties', '45–54': 'in their late forties', '55+': 'in their sixties' }[age] || 'who embodies the target customer';
  const reg = b.a.region ? `, styled authentically for ${b.a.region}` : '';
  return `a natural-looking model ${band}${reg}`;
}
function logoDesc(b) {
  const r = colorRoles(b);
  if (b.logo) return `the ${b.a.name || 'brand'} logo — attach the logo file as an image reference and reproduce it exactly (${b.logo.palette.slice(0, 3).map(p => p.hex).join(', ') || 'brand colours'}); same proportions, no redraw, no extra symbols`;
  return `the “${b.a.name || 'Brand'}” wordmark set in ${b.a.fontPrimary || 'a refined geometric sans-serif'} in ${colorText(r.primary)}`;
}
function mjSuffix(ar, neg) { return ` --ar ${ar === '1.91:1' ? '191:100' : ar} --style raw --s 120 --v 7 --no ${neg.split(/,\s*/).slice(0, 8).join(', ')}`; }

function mockupPrompt(b, pid, variant) {
  const P = PRODUCTS[pid]; if (!P) return '';
  const a = b.a, ind = IND(a.industry), r = colorRoles(b);
  const name = a.name || 'Brand';
  const base = P.kind === 'physical' && ['tshirt', 'hoodie', 'cap', 'tote'].includes(pid) ? (((a.sliders || {}).exclusive ?? 50) > 60 || a.price === 'luxury' ? r.dark : r.primary) : r.primary;
  const brandInks = [r.light, r.secondary, r.accent, r.dark].filter(c => c && c !== base);
  const ink = brandInks.find(c => Color.contrast(base, c) >= 4.5) || [...brandInks, '#FFFFFF', '#111114'].sort((x, y) => Color.contrast(base, y) - Color.contrast(base, x))[0];
  const dark = a.price === 'luxury';
  const bg = dark ? Color.tint(r.primary, .2, .02) : Color.tint(r.primary, .955, .018);
  const ar = variant === 'studio' ? P.ar : P.arL;
  const isDigital = P.kind === 'digital' && !['card'].includes(pid);
  const scene = ind.scene + (a.region ? `, recognisably set in ${a.region}` : '');
  const lifeLine = P.life.replace('{model}', modelFor(b)).replace('{scene}', scene);
  const neg = isDigital
    ? 'gibberish text, lorem ipsum, misaligned UI, inconsistent icon styles, low-contrast text, cluttered layout, watermark, extra logos, distorted device bezels, blurry'
    : 'misspelled or warped text, invented or extra logos, watermark, distorted hands, extra fingers, plastic skin, unrealistic fabric physics, oversaturation, clutter, low resolution, CGI look';
  const lines = [];
  if (isDigital) {
    lines.push(`Photorealistic, art-directed product visual — ${P.subj} for “${name}”, a ${priceLabel(a.price)} ${ind.label.toLowerCase()} brand${a.oneLiner ? ' that ' + a.oneLiner.replace(/^[A-Z][^ ]* (is|helps)/, m => m.toLowerCase()).replace(/\.$/, '') : ''}.`);
    lines.push(`UI DESIGN: ${P.detail}. Use real, plausible content for this brand — no placeholder text. Design tokens: primary ${colorText(r.primary)}${r.secondary ? ', secondary ' + colorText(r.secondary) : ''}${r.accent ? ', accent ' + colorText(r.accent) : ''}, text ${r.dark}, background ${r.light}. Typography: ${a.fontPrimary || 'a modern grotesque sans'} for headings${a.fontSecondary ? ', ' + a.fontSecondary + ' for body' : ''}; 8-pt spacing grid, 12–20 px corner radii, WCAG 2.2 AA text contrast.`);
    lines.push(`BRANDING: ${P.place}. Logo: ${logoDesc(b)}. Render the brand name “${name}” exactly as written.`);
    lines.push(`SCENE: ${variant === 'studio' ? P.studio + `, on a seamless ${Color.name(bg)} (${bg}) backdrop` : lifeLine}.`);
    lines.push(`RENDER: ${variant === 'studio' ? 'physically based 3D render, accurate device materials (glass, aluminium), global illumination, soft area-light reflections, 50 mm virtual lens, subtle depth of field' : 'Sony α1, 35 mm f/1.4 GM at f/2, natural window light, the screen bright and legible, shallow depth of field'}.`);
  } else {
    lines.push(`Ultra-realistic ${variant === 'studio' ? 'commercial studio product photograph' : 'lifestyle campaign photograph'} — ${P.subj} for “${name}”, a ${priceLabel(a.price)} ${ind.label.toLowerCase()} brand.`);
    lines.push(`PRODUCT & MATERIALS: ${P.detail}. Colourway: ${colorText(base)} with ${colorText(ink)} branding (contrast ${Color.contrast(base, ink).toFixed(1)}:1 for clean legibility).`);
    lines.push(`BRANDING: ${P.place}. Logo: ${logoDesc(b)}. Render the text “${name}” exactly as written and no other text.`);
    lines.push(`SCENE: ${variant === 'studio' ? P.studio + `, on a seamless ${Color.name(bg)} (${bg}) paper backdrop with a soft contact shadow` : lifeLine}.`);
    lines.push(`LIGHTING: ${variant === 'studio' ? lighting(b) : 'natural, motivated light — golden-hour sun or large window light — with gentle bounce fill on the subject'}.`);
    lines.push(`CAMERA: ${variant === 'studio' ? 'Phase One XF IQ4 150MP, Schneider 120 mm LS Macro, f/11, ISO 50, focus-stacked for front-to-back sharpness' : ['tshirt', 'hoodie', 'cap', 'shoppingbag', 'tote', 'uniform'].includes(pid) ? 'Canon EOS R5, RF 85 mm f/1.2L at f/2.8, ISO 100, eye-level' : 'Sony α1, 35 mm f/1.4 GM at f/2.2, ISO 200, shallow depth of field'}.`);
  }
  lines.push(`COMPOSITION: ${variant === 'studio' ? 'hero subject on the vertical rule-of-thirds line, slight 15° three-quarter angle, generous negative space' : 'environmental framing, subject on the left third, background softly separated, candid natural gesture'}; aspect ratio ${ar}; leave clean space at the top for headline copy.`);
  lines.push(`STYLING & MOOD: ${moodWords(b)}. Colour grade: ${colorGrade(b)}.`);
  lines.push(`FINISH: high-end retouching, colour-accurate to ${[base, ink, r.primary].filter((v, i, s) => s.indexOf(v) === i).join(' / ')}, crisp micro-detail (${isDigital ? 'pixel-sharp UI, legible type' : 'fabric weave, print texture, edge sharpness'}), 8K, editorial magazine quality, photorealistic.`);
  if (App.settings.imgModel === 'midjourney') return lines.join(' ') + mjSuffix(ar, neg);
  lines.push(`AVOID: ${neg}.`);
  return lines.join('\n');
}

function dossier(b, rep) {
  const a = b.a, ind = IND(a.industry), r = colorRoles(b), nm = analyzeName(a.name);
  const lab = (arr, list) => (arr || []).map(v => (list.find(x => x[0] === v) || [v, v])[1]).join(', ');
  const v = x => isFilled(x) ? x : UNK;
  const L = [];
  L.push(`Brand name: ${v(a.name)}`);
  L.push(`What it does: ${v(a.oneLiner)}`);
  L.push(`Industry / category: ${a.industry ? ind.label : UNK}`);
  L.push(`Offering: ${a.offering ? OFFERINGS.find(o => o.id === a.offering).label : UNK}${(a.products || []).length ? ' — ' + a.products.map(p => PRODUCTS[p] ? PRODUCTS[p].label : p).join(', ') : ''}`);
  L.push(`Stage: ${a.stage ? (STAGES.find(s => s[0] === a.stage) || [, a.stage])[1] : UNK} | Market: ${v(a.region)} | Price tier: ${a.price ? (PRICES.find(p => p[0] === a.price) || [, a.price])[1] : UNK} | Model: ${a.model ? (MODELS.find(m => m[0] === a.model) || [, a.model])[1] : UNK}`);
  L.push(`Target audience: ${v(a.audience)}${(a.age || []).length ? ' (age ' + a.age.join(', ') + ')' : ''}`);
  L.push(`Customer need: ${v(a.need)}`);
  L.push(`Purpose / mission: ${v(a.mission)}`);
  L.push(`Values: ${(a.values || []).length ? a.values.join(', ') : UNK}`);
  L.push(`Differentiator: ${v(a.usp)}`);
  L.push(`Competitors / alternatives: ${v(a.competitors)}`);
  L.push(`Brand promise: ${v(a.promise)}`);
  L.push(`Archetype: ${(a.archetypes || []).length ? a.archetypes.map(id => ARCH(id).name).join(' + ') : UNK}`);
  L.push(`Personality: ${moodWords(b)}`);
  L.push(`Tone of voice: ${(a.tone || []).length ? a.tone.join(', ') : UNK}`);
  L.push(`Tagline: ${v(a.tagline)}`);
  L.push(`Colours: ${r.all.length ? r.all.map(colorText).join(', ') : UNK}`);
  L.push(`Typography: ${a.fontPrimary ? a.fontPrimary + (a.fontSecondary ? ' + ' + a.fontSecondary : '') : UNK}`);
  if (b.logo) L.push(`Logo file: ${b.logo.isVector ? 'vector SVG' : b.logo.w + '×' + b.logo.h + ' px raster'}, ${b.logo.transparent ? 'transparent' : 'solid background'}, ${b.logo.palette.length} colour(s), ${b.logo.edge < .09 ? 'simple' : b.logo.edge < .15 ? 'moderate' : 'high'} detail`);
  L.push(`Logo versions that exist: ${(a.logoVariants || []).length ? lab(a.logoVariants, LOGO_VARIANTS) : 'none confirmed'}`);
  L.push(`Brand assets that exist: ${(a.assets || []).length ? lab(a.assets, ASSETS) : 'none confirmed'}`);
  L.push(`Channels: ${(a.channels || []).length ? lab(a.channels, CHANNELS) : UNK}${a.consistency ? ` | cross-channel consistency ${a.consistency}/5` : ''}`);
  L.push(`Social proof: ${(a.proof || []).length ? lab(a.proof, PROOF) : UNK}`);
  if (a.url) L.push(`Website: ${a.url}`);
  if (nm) L.push(`Name check: ${nm.score}/100 — ${nm.len} letters, ~${nm.syl} syllable(s)`);
  if (rep) {
    L.push('');
    L.push(`AUDIT RESULT: ${rep.overall}/100 (${rep.grade}, ${rep.maturity}). Data completeness ${rep.completeness}%.`);
    L.push('Dimension scores: ' + rep.dims.map(d => `${d.label} ${d.score}`).join(' · '));
    if (rep.gaps.length) { L.push('Top gaps:'); rep.gaps.slice(0, 10).forEach(g => L.push(`- [${SEV_LABEL[g.sev]}] ${g.title}`)); }
  }
  return L.join('\n');
}

function promptMaster(b, rep) {
  const a = b.a, ind = IND(a.industry);
  return `You are a world-class brand strategist and creative director with 20 years at agencies such as Pentagram, Wolff Olins, Landor and Interbrand. You combine rigorous strategy (Kapferer’s Identity Prism, Aaker’s brand identity model, Keller’s CBBE pyramid, Byron Sharp and Jenni Romaniuk’s distinctive brand assets, Interbrand’s ten brand-strength factors) with exceptional visual judgement and accessibility standards (WCAG 2.2).

Your task: turn the brand below into a professional, distinctive, consistent brand that could stand next to category leaders.

=== BRAND DOSSIER ===
${dossier(b, rep)}
=== END DOSSIER ===

Before you begin: list any information marked UNKNOWN that would materially change your recommendations and ask me up to 6 sharp questions. If I tell you to proceed, state your assumptions explicitly and continue. Never invent facts, statistics, awards or customer quotes.

Deliver the following, in order, using clear headings:

1. Diagnosis — the 5 most important problems holding this brand back, ranked by business impact, each with evidence from the dossier.
2. Brand platform — purpose, vision, mission, 3–5 values (each with a behaviour that proves it), brand promise and 3 brand pillars.
3. Positioning — target audience persona, frame of reference, point of difference, reasons to believe, and a one-sentence positioning statement. Map 4–6 competitors on two axes that matter in ${ind.label.toLowerCase()} and show where the white space is.
4. Personality & voice — lead archetype, 4 tone principles written as “We are X, not Y”, a vocabulary list (use / avoid), and before→after rewrites of a headline, a product description and a social caption.
5. Messaging house — umbrella message, 3 supporting messages with proof points, 10 tagline options (2–7 words, ownable, tested against the positioning) with your top 3 recommended and why.
6. Visual identity direction — logo assessment and concrete refinement brief (simplification, symbol, lock-ups, clear space, minimum sizes); a colour system with exact HEX, RGB, CMYK and closest Pantone, each colour’s role and usage ratio (60-30-10), and contrast ratios for every text/background pairing; a type system (primary + secondary, licence notes, full type scale from display to caption); imagery and iconography rules.
7. Distinctive brand assets — which assets the brand should own (colour, shape, character, sound, pattern, phrase) and how to build their fame consistently.
8. Touchpoints — the ${a.offering === 'physical' ? 'packaging, labels, unboxing, retail and product' : a.offering === 'digital' ? 'app icon, onboarding, UI, App Store and website' : 'environment, uniforms, documents, website and customer service'} experience, channel-by-channel guidance for ${(a.channels || []).length ? a.channels.join(', ') : 'the most relevant channels'}.
9. 90-day roadmap — weekly milestones, owner role, effort estimate and KPI for each initiative. Prioritise quick wins first.
10. Measurement — a brand-health scorecard (awareness, consideration, preference, NPS, share of search, consistency score) with targets for 6 and 12 months. Category KPIs to watch: ${ind.metrics}.

Quality bar: specific to THIS brand, never generic; every recommendation actionable; explain the reasoning briefly; flag risks and trade-offs; keep cultural context of ${a.region || 'the target market'} in mind.`;
}

function promptPlatform(b, rep) {
  return `Act as a senior brand strategist facilitating a positioning workshop. Run it with me interactively.

${dossier(b, rep)}

Workshop flow — ask me one section at a time, wait for my answers, then synthesise:
1. Customer truth: ask 5 questions to uncover the real job-to-be-done, frustrations with current alternatives and the emotional payoff.
2. Competitive landscape: build a positioning map with me (choose the two most decisive axes for this category) and identify the white space.
3. Point of difference: propose 5 candidate differentiators; score each on Relevance, Distinctiveness, Credibility and Defensibility (1–5); recommend one.
4. Brand platform: draft purpose, mission, vision, values (with behaviours), promise and pillars. Offer two alternative versions with different tones.
5. Positioning statement: “For [audience] who [need], [brand] is the [frame of reference] that [point of difference] because [reasons to believe].” Give 3 variants.
6. Brand story: a 150-word origin/mission story and a 30-word elevator version.
Close with a one-page summary I can paste into my brand book.`;
}

function promptVoice(b, rep) {
  const a = b.a;
  return `You are the head of brand voice at a top consumer brand. Create a complete verbal identity for “${a.name || 'the brand'}”.

${dossier(b, rep)}

Deliver:
- Voice summary in one sentence and 4 voice principles, each as “We are __, not __” with a do/don’t example.
- Tone dial: how the voice flexes across 6 situations (launch, everyday social, customer support, apology/outage, sales page, investor update) with a sample line for each.
- Vocabulary: 25 words and phrases we own, 15 we avoid, and our preferred spelling, capitalisation and punctuation rules (incl. emoji policy).
- Messaging house: umbrella message, 3 pillars, 3 proof points each.
- Copy kit: homepage hero (3 headline + subhead options), product/service description (short, medium, long), email signature line, 5 social bios (≤150 chars), 10 CTAs, 10 social captions in voice, 3 customer-support macros.
- 15 tagline options (2–7 words) grouped by strategy (benefit, attitude, category-defining), with your top 3 and rationale.
Write everything in the brand’s voice. Mark any claim that needs proof with [VERIFY].`;
}

function promptNaming(b) {
  const a = b.a, nm = analyzeName(a.name);
  return `Act as a naming and verbal-identity specialist (in the tradition of Lexicon and A Hundred Monkeys).

Current name: ${a.name || UNK}${nm ? ` (length ${nm.len}, ~${nm.syl} syllables, internal score ${nm.score}/100)` : ''}
What it does: ${a.oneLiner || UNK}
Audience: ${a.audience || UNK} | Market: ${a.region || UNK} | Personality: ${moodWords(b)}

1. Evaluate the current name on: distinctiveness, memorability, pronounceability (including in ${a.region || 'the core market'}), spelling-from-hearing, meaning and associations, trademark risk signals, domain/handle practicality, scalability to new products. Score each 1–5 and be candid.
2. Suggest how to strengthen it without renaming (short form, monogram, descriptor line, sonic cue).
3. If a rename or sub-brand is warranted, generate 30 candidates across 5 naming strategies (descriptive, evocative, invented, compound, metaphor), each with rationale and pronunciation guide. Shortlist 5.
4. Write 20 tagline options (2–7 words) and 5 descriptor lines.
5. Give a checklist to verify trademarks (e.g. national trademark registry, WIPO Global Brand Database, USPTO), domains and social handles — do not claim anything is available.`;
}

function promptKit(b, rep) {
  const a = b.a, r = colorRoles(b), off = a.offering || 'hybrid';
  const phys = off === 'physical' || off === 'hybrid', dig = off === 'digital' || off === 'hybrid';
  return `You are a design director producing a professional brand guidelines book (the standard of brand books from Apple, Airbnb, Spotify and Mastercard). Create the complete brand kit for “${a.name || 'the brand'}”.

${dossier(b, rep)}

Produce the guidelines as structured chapters with exact specifications (numbers, not adjectives):

1. Brand core — purpose, promise, values, personality, archetype, positioning in one page.
2. Logo system — primary, horizontal, stacked, symbol, wordmark, monochrome, reversed, favicon/app icon. For each: when to use, clear-space rule (defined by a unit of the mark, e.g. the cap-height “x”), minimum sizes (digital px and print mm), backgrounds allowed, and 10 misuse examples (stretching, recolouring, effects, rotation, busy backgrounds, outlines, re-typesetting…).
3. Colour — roles (primary, secondary, accent, neutrals, semantic success/warning/error), each with HEX, RGB, CMYK, closest Pantone (Coated/Uncoated), and a 50–950 tint scale. Usage ratios (60-30-10). A contrast table listing every allowed text/background pairing with its ratio and WCAG 2.2 AA/AAA result. Current colours to consider: ${r.all.length ? r.all.join(', ') : 'none defined — propose a palette'}.
4. Typography — primary and secondary typefaces (with licence type and free alternatives), weights, a full type scale (display, H1–H6, body, caption, overline) with size/line-height/tracking for web, mobile and print, plus hierarchy examples.
5. Graphic language — grid and layout system, corner radius, iconography style (stroke, grid, corners), patterns or graphic devices derived from the logo, data-visualisation colour order.
6. Photography & illustration — subject matter, lighting, composition, colour grade, casting/diversity guidance, do/don’t examples, and 5 ready-to-use image-generation prompts in this style.
7. Motion & sound — easing curves, durations, logo animation storyboard, optional sonic logo brief.
8. Voice & tone — principles, vocabulary, examples by channel.
${phys ? '9. Physical product & packaging — packaging architecture (master brand vs. variant colour-coding), label information hierarchy, dielines to brief, materials and finishes (foil, emboss, soft-touch, uncoated), print specs (CMYK, 300 dpi, 3 mm bleed, Pantone spot use), apparel trims (woven labels, hang tags, care labels), unboxing sequence, retail display.\n' : ''}${dig ? `${phys ? '10' : '9'}. Digital product — app icon grid (1024 px master, 16–1024 export sizes), favicon set (16/32/180/192/512), UI design tokens (colour, type, spacing 4/8-pt, radius, elevation), component style notes, App Store/Play Store screenshot system, OG image 1200×630, accessibility rules.\n` : ''}${phys && dig ? '11' : '10'}. Applications — business card, letterhead, email signature, social templates (1080×1350 post, 1080×1920 story), presentation template, website hero, signage, merchandise.
${phys && dig ? '12' : '11'}. Asset management — file naming convention, folder structure, file formats (SVG, PDF, PNG @1x/2x/3x, EPS), and who approves brand usage.

Finish with: a design-tokens JSON block, CSS custom properties, and a one-page “brand on a page” cheat sheet. Flag anything that needs a designer to finalise in Figma or Illustrator.`;
}

function promptLogo(b) {
  const a = b.a, r = colorRoles(b), ind = IND(a.industry);
  const base = `Professional logo design exploration for “${a.name || 'Brand'}”, a ${priceLabel(a.price)} ${ind.label.toLowerCase()} brand${a.oneLiner ? ' — ' + a.oneLiner.replace(/\.$/, '') : ''}. Personality: ${moodWords(b)}. ${b.logo ? 'Use the attached current logo as the starting point: evolve it (simplify, rebalance, improve small-size legibility) while keeping its core recognisable idea.' : 'Create a new mark.'}
Present a 2×2 board on a clean ${r.light} background: (1) primary horizontal lock-up — symbol plus wordmark; (2) stacked lock-up; (3) symbol alone inside an app-icon superellipse; (4) monochrome reversed on ${r.dark}.
Design rules: flat vector style, geometric construction on a visible-grid logic, 1–2 colours from ${[r.primary, r.secondary || r.accent].filter(Boolean).join(' and ')}, strong silhouette that works at 16 px, balanced negative space, optical kerning, no gradients, no mock-3D, no tiny details, no generic clip-art shapes, no stock icons. Typography: ${a.fontPrimary ? 'set the wordmark in ' + a.fontPrimary + ' or a custom-drawn refinement of it' : 'a custom-feeling wordmark in a refined sans or serif that matches the personality'}. Render the name “${a.name || 'Brand'}” exactly as written.
Style references: the restraint of Paul Rand, the systems thinking of Pentagram, the clarity of Swiss modernism.`;
  if (App.settings.imgModel === 'midjourney') return base.replace(/\n/g, ' ') + mjSuffix('1:1', 'gradients, 3D, photo, mockup, watermark, extra text, misspelled text');
  return base + '\nAVOID: gradients, 3D bevels, photorealism, drop shadows, more than two colours, misspelled text, extra words, watermark. Aspect ratio 1:1.';
}

function promptMoodboard(b) {
  const a = b.a, r = colorRoles(b), ind = IND(a.industry);
  const t = `Art-directed brand identity moodboard for “${a.name || 'Brand'}”, a ${priceLabel(a.price)} ${ind.label.toLowerCase()} brand. Layout: an editorial 3×3 collage on ${r.light} with tidy gutters. Tiles: a hero lifestyle photo (${ind.scene}), a close-up material/texture shot, a colour palette card showing ${r.all.slice(0, 5).join(', ') || 'the proposed palette'}, a typography specimen (${a.fontPrimary || 'modern sans'}${a.fontSecondary ? ' with ' + a.fontSecondary : ''}), an icon and pattern sample derived from the brand mark, a product-in-use moment, packaging or UI detail, a portrait of the target customer (${modelFor(b)}), and a mood word card. Mood: ${moodWords(b)}. Colour grade: ${colorGrade(b)}. Photographic quality, consistent lighting across tiles, premium editorial design.`;
  return App.settings.imgModel === 'midjourney' ? t + mjSuffix('4:5', 'clutter, watermark, misspelled text, low resolution') : t + '\nAspect ratio 4:5. AVOID: clutter, inconsistent styles, misspelled text, watermark.';
}

function promptPitch(b, rep) {
  const a = b.a, ind = IND(a.industry), r = colorRoles(b);
  return `You are a pitch-deck strategist who has helped startups raise from top-tier VCs, combined with a presentation designer trained on Apple keynote principles: one idea per slide, huge type, generous whitespace, product as hero.

Create a complete investor pitch deck for “${a.name || 'the company'}”.

${dossier(b, rep)}

Structure (12–14 slides, following the proven Sequoia / Y Combinator narrative):
1. Title — name, logo, one-line positioning (≤10 words).
2. Problem — the painful, specific problem with one striking data point [VERIFY source].
3. Solution — how ${a.name || 'we'} solve it; show the product.
4. Why now — market, technology or behaviour shift making this the moment.
5. Market size — TAM / SAM / SOM with bottom-up logic and sources.
6. Product — 3 key features as benefits, with visuals.
7. Business model — how we make money, pricing, unit economics.
8. Traction — growth chart and milestones. Key category metrics: ${ind.metrics}.
9. Go-to-market — channels (${(a.channels || []).join(', ') || 'to define'}), CAC strategy, partnerships.
10. Competition — 2×2 positioning map and an honest comparison table; our unfair advantage: ${a.usp || UNK}.
11. Team — founders and key hires, why we win.
12. Financials — 3-year projection, key assumptions.
13. The ask — amount, use of funds (pie), milestones it unlocks.
14. Vision — the big future and closing line.

For each slide give: headline (assertive, ≤8 words), 2–3 supporting points max, the exact visual or chart to show, speaker notes (60–90 seconds), and the data I must supply marked [DATA NEEDED].

Design system for the deck: 16:9, background ${r.light} with ${r.dark} type, primary ${r.primary}${r.accent ? ', accent ' + r.accent : ''}; headlines in ${a.fontPrimary || 'a bold grotesque sans'} at 54–72 pt, body ${a.fontSecondary || a.fontPrimary || 'the same family'} 20–24 pt; one chart style; logo bottom-left on content slides; no more than 25 words per slide. Tone: ${moodWords(b)}.
Also provide: a 1-minute verbal pitch, the 10 hardest investor questions with strong answers, and a one-page executive summary. Export-ready for Keynote, PowerPoint, Google Slides, Pitch or Gamma.`;
}

function promptSales(b, rep) {
  const a = b.a;
  return `Create a client-facing sales / capabilities deck for “${a.name || 'the brand'}” aimed at ${a.audience || 'the target buyer'}.

${dossier(b, rep)}

Slides (10–12): cover; the customer’s world (their problem in their words); cost of inaction; our approach; offer/packages with clear outcomes; how it works (3–5 steps); proof (case studies with before→after metrics, testimonials, logos) [VERIFY]; why us vs. alternatives; pricing or engagement model; implementation timeline; guarantees and risk reversal; clear next step / CTA.
For each slide provide headline, body copy (≤30 words), visual direction and speaker notes. Use the brand colours, fonts and tone from the dossier. Add a one-page leave-behind and a follow-up email sequence (3 emails).`;
}

function promptSocial(b, rep) {
  const a = b.a, ind = IND(a.industry);
  return `You are a social-first creative strategist. Build a 30-day content system for “${a.name || 'the brand'}”.

${dossier(b, rep)}

Deliver:
1. 4 content pillars (each tied to a brand pillar or customer need) with the ratio of posts per pillar.
2. Platform plan for ${(a.channels || []).filter(c => !['website', 'retail', 'events', 'email'].includes(c)).join(', ') || ind.ch.join(', ')} — format mix (carousel, reel/short, static, story, live), posting cadence and best practices for each.
3. A 30-day calendar table: day, platform, pillar, format, hook (first 3 seconds / first line), caption in brand voice, CTA, and hashtags (5–8, mix of niche and broad).
4. 10 reusable template concepts (layouts) consistent with the visual identity.
5. 5 short-video scripts (hook, beats, on-screen text, ending CTA) and 3 carousel outlines (10 slides each).
6. Community playbook: reply tone, UGC strategy, creator/influencer brief template.
7. KPIs per platform and a weekly review ritual.
Category opportunities to exploit: ${ind.opp}.`;
}

function promptWeb(b, rep) {
  const a = b.a;
  return `Act as a conversion copywriter and UX strategist. Write the full website for “${a.name || 'the brand'}”.

${dossier(b, rep)}

Provide: sitemap; for the homepage — hero (headline ≤8 words, subhead ≤20 words, primary + secondary CTA), social-proof bar, problem → solution section, 3–4 benefit blocks, how-it-works, ${a.offering === 'physical' ? 'featured products and collection story' : a.offering === 'digital' ? 'product tour and pricing teaser' : 'services overview and process'}, testimonials [VERIFY], FAQ (8 questions), final CTA and footer; plus About, ${a.offering === 'digital' ? 'Pricing' : 'Products/Services'} and Contact pages. Include SEO title (≤60 chars) and meta description (≤155 chars) for each page, image direction for every section, and microcopy (buttons, form labels, error and empty states). Keep it accessible (plain language, descriptive links) and in brand voice.`;
}

function allPrompts(b, rep) {
  const a = b.a, out = [];
  out.push({ id: 'master', cat: 'strategy', title: 'Brand transformation master prompt', desc: 'Paste into Claude, ChatGPT or Gemini to get a full strategic overhaul built on your audit.', tool: 'AI assistant', text: promptMaster(b, rep) });
  out.push({ id: 'platform', cat: 'strategy', title: 'Positioning & brand platform workshop', desc: 'An interactive workshop that ends with your positioning statement and brand story.', tool: 'AI assistant', text: promptPlatform(b, rep) });
  out.push({ id: 'voice', cat: 'strategy', title: 'Voice, tone & messaging house', desc: 'Verbal identity: principles, vocabulary, copy kit and taglines.', tool: 'AI assistant', text: promptVoice(b, rep) });
  out.push({ id: 'naming', cat: 'strategy', title: 'Naming & tagline studio', desc: 'Stress-test the name and generate taglines and descriptors.', tool: 'AI assistant', text: promptNaming(b) });
  out.push({ id: 'kit', cat: 'visual', title: 'Complete brand kit & guidelines book', desc: `Logo system, colour, type, imagery${a.offering === 'physical' ? ', packaging' : a.offering === 'digital' ? ', UI tokens' : ''} and applications — with exact specs.`, tool: 'AI assistant', text: promptKit(b, rep) });
  out.push({ id: 'logo', cat: 'visual', title: 'Logo refinement board', desc: 'An image-model prompt for a 2×2 logo exploration board.', tool: 'Image model', text: promptLogo(b) });
  out.push({ id: 'mood', cat: 'visual', title: 'Visual identity moodboard', desc: 'An editorial 3×3 moodboard to align everyone on the look.', tool: 'Image model', text: promptMoodboard(b) });
  let prods = (a.products || []).filter(p => PRODUCTS[p]);
  if (!prods.length) prods = IND(a.industry).prod.slice(0, 4);
  prods.forEach(pid => {
    const P = PRODUCTS[pid];
    out.push({ id: 'mk_' + pid + '_s', cat: 'mockups', title: P.label + ' — studio hero', desc: 'E-commerce and catalogue quality, ' + P.ar + '.', tool: 'Image model', text: mockupPrompt(b, pid, 'studio'), tip: true });
    out.push({ id: 'mk_' + pid + '_l', cat: 'mockups', title: P.label + ' — lifestyle campaign', desc: 'Campaign photography in context, ' + P.arL + '.', tool: 'Image model', text: mockupPrompt(b, pid, 'life'), tip: true });
  });
  out.push({ id: 'social', cat: 'content', title: '30-day social content system', desc: 'Pillars, platform plan, full calendar, scripts and KPIs.', tool: 'AI assistant', text: promptSocial(b, rep) });
  out.push({ id: 'web', cat: 'content', title: 'Website copy & structure', desc: 'Sitemap, conversion copy, SEO meta and microcopy.', tool: 'AI assistant', text: promptWeb(b, rep) });
  out.push({ id: 'pitch', cat: 'pitch', title: 'Investor pitch deck', desc: '14-slide Sequoia/YC narrative with design system and speaker notes.', tool: 'AI assistant / Gamma', text: promptPitch(b, rep) });
  out.push({ id: 'sales', cat: 'pitch', title: 'Client sales deck', desc: 'Capabilities deck, leave-behind and follow-up emails.', tool: 'AI assistant', text: promptSales(b, rep) });
  return out;
}

<script>
'use strict';

function newBrand() {
  return {

    a: { name: '', oneLiner: '', industry: '', offering: '', products: [], stage: '', region: '', price: '', model: '', audience: '', age: [], need: '', mission: '', values: [], usp: '', competitors: '', promise: '', archetypes: [], sliders: {}, tone: [], tagline: '', logoVariants: [], colors: [], fontPrimary: '', fontSecondary: '', assets: [], channels: [], consistency: 0, handles: '', domain: '', proof: [], url: '' },

}
function normalizeBrand(b) {

  const out = Object.assign(base, b, { a: Object.assign(base.a, b.a || {}), ai: Object.assign(base.ai, b.ai || {}), src: b.src || {} });

};
let saveTimer = null;
function autosave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { if (App.brand) Brands.save(App.brand, true); }, 450); }

/* =========================== UI primitives =========================== */
let toastTimer = null;
function toast(msg, action) {
  const t = $('#toast'); if (!t) return;
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-toast-act>${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('[data-toast-act]').onclick = () => { t.classList.remove('show'); action.fn(); };
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? 8000 : 3200);
}
function openModal(html, opts = {}) {
  closeModal();
  const root = $('#modal-root');
  root.innerHTML = `<div class="backdrop" data-backdrop><div class="sheet ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(opts.label || 'Dialog')}" tabindex="-1"><div class="grabber"></div>${html}</div></div>`;
  const bd = root.firstElementChild;
  bd.addEventListener('click', e => { if (e.target === bd && !opts.sticky) closeModal(); });
  App._lastFocus = document.activeElement;
  setTimeout(() => { const f = bd.querySelector('[autofocus]') || bd.querySelector('.sheet'); f && f.focus(); }, 30);
  document.body.style.overflow = 'hidden';
  return bd;
}
function closeModal() {
  const root = $('#modal-root'); if (!root || !root.firstChild) return;
  root.innerHTML = ''; document.body.style.overflow = '';
  if (App._lastFocus && App._lastFocus.focus) { try { App._lastFocus.focus(); } catch (e) { /* ignore */ } }
}
async function copyText(text, label = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(label); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove(); toast(ok ? label : 'Copy blocked — select the text and copy manually.'); return ok;
  }
}
function download(name, content, mime = 'text/plain') {
  try {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Downloaded ' + name);
  } catch (e) { toast('Download failed: ' + e.message); }
}
const slug = s => String(s || 'brand').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'brand';

/* =========================== Navigation =========================== */
const VIEWS = [
  { id: 'analyze', label: 'Analyze', ic: 'i-wand' },
  { id: 'report', label: 'Report', ic: 'i-chart' },
  { id: 'prompts', label: 'Prompts', ic: 'i-prompt' },

function renderNav() {

function go(view, opts = {}) {

/* =========================== Analyze: start screen =========================== */
function renderAnalyze() {
  if (App.mode === 'wizard' && App.brand) return renderWizard();
  const el = $('#view-analyze');
  const cur = App.brand;
  const lg = App.pendingLogo;
  el.innerHTML = `
  <div class="hero">
    <h1 class="t-large">What brand are we looking at?</h1>
    <p class="t-callout muted" style="margin-top:8px;max-width:58ch">Type a name, paste a website or drop a logo. Marque scores the brand against professional standards, asks only what's missing, and writes the prompts to fix it.</p>
  </div>

  </div>
  <p class="t-foot muted" style="margin:22px 4px 0">${AI.ready() ? `AI assist is on (${esc(AI_PROVIDERS[App.settings.aiProvider].label)}). It will pre-fill what it can infer.` : 'Works fully offline with the built-in rubric. Add an AI key in Settings to auto-fill answers from a name, logo or website.'}</p>`;
  const inp = $('#spot-input'), spot = $('#spot');
  inp.addEventListener('focus', () => spot.classList.add('focus'));

function updateDetect() {

async function handleLogoFile(file, target) {

}
async function startAnalysis() {

  const u = parseUrl(raw);

  const sw = size * .085, r = (size - sw) / 2 - 2, c = 2 * Math.PI * r, off = c * (1 - clamp(score, 0, 100) / 100), m = size / 2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score ${score} out of 100">
  <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${sw}"/>
  <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${m} ${m})"/>
  <text x="${m}" y="${m - size * .03}" text-anchor="middle" dominant-baseline="central" font-size="${size * .3}" font-weight="700" fill="var(--label)" style="letter-spacing:-.03em">${score}</text>
  <text x="${m}" y="${m + size * .19}" text-anchor="middle" font-size="${size * .085}" fill="var(--label2)">of 100</text></svg>`;
}
const SHORT = { strategy: 'Strategy', positioning: 'Positioning', audience: 'Audience', personality: 'Personality', logo: 'Logo', color: 'Colour', type: 'Type', voice: 'Voice', consistency: 'Consistency', presence: 'Presence' };
function radarSvg(series, labels) {
  const S = 420, n = labels.length, cx = S / 2, cy = S / 2, R = S * .32;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100]; };
  let g = '';
  [25, 50, 75, 100].forEach(lv => { g += `<polygon points="${labels.map((_, i) => pt(i, lv).map(x => x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--sep)" stroke-width="1"/>`; });
  labels.forEach((l, i) => {
    const [x, y] = pt(i, 100); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--sep)"/>`;
    const [lx, ly] = pt(i, 118); const anchor = Math.abs(lx - cx) < 8 ? 'middle' : lx > cx ? 'start' : 'end';
    g += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="central" font-size="13" font-weight="600" fill="var(--label2)">${esc(l)}</text>`;
  });
  series.forEach(s => {
    const pts = s.values.map((v, i) => pt(i, clamp(v, 0, 100)).map(x => x.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${pts}" fill="${s.fill || 'none'}" stroke="${s.color}" stroke-width="${s.dash ? 1.6 : 2.4}" ${s.dash ? 'stroke-dasharray="5 5"' : ''} stroke-linejoin="round"/>`;
    if (!s.dash) s.values.forEach((v, i) => { const [x, y] = pt(i, clamp(v, 0, 100)); g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${s.color}"/>`; });
  });
  return `<svg viewBox="-80 -6 ${S + 160} ${S + 12}" width="100%" style="max-width:560px;display:block;margin:0 auto" role="img" aria-label="Radar chart of dimension scores">${g}</svg>`;
}
function donutSvg(parts, size = 132) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1, sw = 18, r = (size - sw) / 2, c = 2 * Math.PI * r, m = size / 2;
  let acc = 0, g = `<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${sw}"/>`;
  parts.forEach(p => { if (!p.v) return; const len = c * p.v / total; g += `<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-dasharray="${(len - 2).toFixed(2)} ${(c - len + 2).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${m} ${m})"/>`; acc += len; });
  const n = parts.reduce((s, p) => s + p.v, 0);
  g += `<text x="${m}" y="${m - 4}" text-anchor="middle" dominant-baseline="central" font-size="30" font-weight="700" fill="var(--label)">${n}</text><text x="${m}" y="${m + 18}" text-anchor="middle" font-size="11" fill="var(--label2)">gaps</text>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${n} gaps by severity">${g}</svg>`;
}
function prismSvg(b) {
  const S = 240, c = S / 2, R = 104, pts = [...Array(6)].map((_, i) => { const a = (-90 + 60 * i) * Math.PI / 180; return [c + R * Math.cos(a), c + R * Math.sin(a)]; });
  const col = Color.norm(primaryColor(b)) || '#007AFF';
  const inner = b.logo && b.logo.src ? `<image href="${b.logo.src}" x="${c - 34}" y="${c - 34}" width="68" height="68" preserveAspectRatio="xMidYMid meet"/>` : `<text x="${c}" y="${c}" text-anchor="middle" dominant-baseline="central" font-size="38" font-weight="700" fill="${col}">${esc((b.a.name || '?').charAt(0).toUpperCase())}</text>`;
  return `<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:260px;display:block;margin:0 auto" role="img" aria-label="Brand identity prism">
   <polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${col}" fill-opacity=".08" stroke="${col}" stroke-width="2"/>
   <line x1="${c}" y1="${c - R}" x2="${c}" y2="${c + R}" stroke="${col}" stroke-opacity=".35" stroke-dasharray="4 4"/>
   <line x1="${pts[5][0]}" y1="${pts[5][1]}" x2="${pts[1][0]}" y2="${pts[1][1]}" stroke="${col}" stroke-opacity=".25"/>
   <line x1="${pts[4][0]}" y1="${pts[4][1]}" x2="${pts[2][0]}" y2="${pts[2][1]}" stroke="${col}" stroke-opacity=".25"/>
   <circle cx="${c}" cy="${c}" r="44" fill="var(--card)" stroke="${col}" stroke-opacity=".3"/>${inner}
   <text x="${c}" y="9" text-anchor="middle" font-size="10.5" fill="var(--label2)">Picture of sender</text>
   <text x="${c}" y="${S - 2}" text-anchor="middle" font-size="10.5" fill="var(--label2)">Picture of recipient</text>
  </svg>`;
}

/* =========================== Google Fonts (online, best-effort) =========================== */
const loadedFonts = new Set();
function loadFonts(list) {
  if (!navigator.onLine) return;
  const fams = [...new Set(list.filter(Boolean).map(f => String(f).trim()).filter(f => /^[A-Za-z0-9 ]{2,40}$/.test(f) && !loadedFonts.has(f)))];
  if (!fams.length) return;
  fams.forEach(f => loadedFonts.add(f));
  const href = 'https://fonts.googleapis.com/css2?' + fams.map(f => 'family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@400;600;700').join('&') + '&display=swap';
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onerror = () => l.remove(); document.head.appendChild(l);
}
const ff = f => f ? `'${String(f).replace(/['"\\<>]/g, '')}', var(--font)` : 'var(--font)';
function brandTags(b) {
  const s = b.a.sliders || {}, t = new Set(IND(b.a.industry).tags || []);
  if ((s.exclusive ?? 50) > 60 || b.a.price === 'luxury') t.add('luxury');
  if ((s.modern ?? 50) < 40) t.add('classic'); if ((s.modern ?? 50) > 62) t.add('modern');
  if ((s.serious ?? 50) < 40) { t.add('playful'); t.add('friendly'); }
  if ((s.authoritative ?? 50) < 40) t.add('friendly'); if ((s.authoritative ?? 50) > 62) t.add('corporate');
  if ((s.expressive ?? 50) > 62) t.add('expressive'); if ((s.expressive ?? 50) < 38) t.add('minimal');
  if ((s.bold ?? 50) > 62) t.add('bold');
  (b.a.archetypes || []).forEach(a => ({ ruler: ['luxury', 'classic'], lover: ['luxury', 'editorial'], sage: ['corporate', 'editorial'], creator: ['expressive', 'modern'], jester: ['playful'], hero: ['bold', 'sports'], outlaw: ['bold', 'streetwear'], caregiver: ['wellness', 'friendly'], innocent: ['friendly', 'minimal'], everyman: ['friendly'], explorer: ['bold'], magician: ['expressive', 'editorial'] })[a]?.forEach(x => t.add(x)));
  return [...t];
}
function fontRecs(b, n = 3) {
  const tags = brandTags(b);
  return FONT_PAIRS.map(p => ({ p, s: p.tags.filter(t => tags.includes(t)).length })).sort((x, y) => y.s - x.s).slice(0, n).map(x => x.p);
}

/* =========================== AI insights =========================== */
async function runAIInsights() {
  const b = App.brand; if (!b || !b.report) return;
  if (!AI.ready()) { openSettings(); return; }
  const btn = $('[data-action="ai-insights"]'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Thinking'; }
  try {
    const system = 'You are a senior brand strategist. Return only valid JSON with no markdown fences.';
    const prompt = `Audit this brand and return strategic insights.\n\n${dossier(b, b.report)}\n\nReturn JSON exactly in this shape:\n{"summary": "2-3 sentence executive summary", "positioning": "one-sentence positioning statement", "swot": {"strengths": [3-4 strings], "weaknesses": [3-4], "opportunities": [3-4], "threats": [3-4]}, "taglines": [6 tagline options, 2-7 words each], "recommendations": [{"title": string, "detail": "1-2 sentences, specific", "priority": "high"|"medium"|"low"}] (5-7 items)}\nBe specific to this brand; do not invent facts.`;
    const txt = await AI.call({ system, prompt, image: b.logo && b.logo.src ? b.logo.src : null, maxTokens: 2500, web: !!b.a.url });
    const o = parseJSONLoose(txt); if (!o) throw new Error('the AI response was not valid JSON');
    const arr = (v, n) => Array.isArray(v) ? v.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, 300)).slice(0, n) : [];
    const sw = o.swot || {};
    b.ai.insights = {
      source: 'ai', at: Date.now(), summary: typeof o.summary === 'string' ? o.summary.slice(0, 900) : '', positioning: typeof o.positioning === 'string' ? o.positioning.slice(0, 600) : '',
      swot: { strengths: arr(sw.strengths, 5), weaknesses: arr(sw.weaknesses, 5), opportunities: arr(sw.opportunities, 5), threats: arr(sw.threats, 5) },
      taglines: arr(o.taglines, 8),
      recommendations: Array.isArray(o.recommendations) ? o.recommendations.filter(x => x && x.title).slice(0, 8).map(x => ({ title: String(x.title).slice(0, 140), detail: String(x.detail || '').slice(0, 400), priority: ['high', 'medium', 'low'].includes(x.priority) ? x.priority : 'medium' })) : []
    };
    Brands.save(b); renderReport(); toast('AI insights added');
  } catch (e) { toast('AI insights failed: ' + e.message); if (btn) { btn.disabled = false; btn.innerHTML = icon('i-wand') + 'Try again'; } }
}

function reportMarkdown(b) {
  const rep = b.report, a = b.a, ins = b.ai.insights || localInsights(b, rep), r = colorRoles(b);
  const L = [`# ${a.name} — Brand Report`, `_Generated by Marque on ${fmtDate(rep.at)}_`, '', `**Overall score:** ${rep.overall}/100 (${rep.grade}, ${rep.maturity})  `, `**Score if gaps fixed:** ~${rep.potential}  `, `**Data confidence:** ${rep.completeness}%`, '', '## Dimension scores', '| Dimension | Score | Weight |', '|---|---|---|', ...rep.dims.map(d => `| ${d.label} | ${d.score} | ${Math.round(d.w * 100)}% |`), '', '## Gaps', ...rep.gaps.map(g => `- **[${SEV_LABEL[g.sev]}] ${g.title}** (+${g.pts} pts, ${EFFORT[g.eff]}) — ${g.fix}`), '', '## Positioning', '> ' + (ins.positioning || positioningStatement(a)), '', '## SWOT'];
  ['strengths', 'weaknesses', 'opportunities', 'threats'].forEach(k => { L.push(`**${titleCase(k)}**`); (ins.swot[k] || []).forEach(x => L.push('- ' + x)); L.push(''); });
  if (r.all.length) { L.push('## Colours'); r.all.forEach(c => L.push(`- ${c} — ${Color.name(c)} (vs white ${Color.contrast(c, '#FFFFFF').toFixed(2)}:1, vs black ${Color.contrast(c, '#000000').toFixed(2)}:1)`)); L.push(''); }

function exportPDF() {

const GUIDES = [
  ['The professional brand system', `<p>A professional brand is a system, not a logo. Category leaders document and govern every layer:</p><ol><li><b>Strategy</b>: purpose, positioning, audience, values, promise, architecture.</li><li><b>Verbal identity</b>: name, tagline, voice, messaging house, vocabulary.</li><li><b>Visual identity</b>: logo system, colour, typography, grid, iconography, imagery, motion.</li><li><b>Touchpoints</b>: product, packaging, digital, environments, people, service.</li><li><b>Governance</b>: guidelines, templates, asset library, approvals, measurement.</li></ol><p>Marque’s ten scoring dimensions map to these layers, so every gap points to a specific part of the system.</p>`],
  ['Strategy frameworks', `<ul><li><b>Golden Circle (Sinek)</b> — start with why (purpose), then how (approach), then what (offer).</li><li><b>Brand Identity Prism (Kapferer)</b> — six facets: physique, personality, culture, relationship, reflection, self-image. Strong brands are coherent across all six.</li><li><b>Customer-Based Brand Equity (Keller)</b> — salience → performance and imagery → judgements and feelings → resonance. Build from the bottom.</li><li><b>Brand Identity Model (Aaker)</b> — brand as product, organisation, person and symbol; core identity vs. extended identity.</li><li><b>Interbrand brand-strength factors</b> — clarity, commitment, governance, responsiveness (internal); authenticity, relevance, differentiation, consistency, presence, engagement (external).</li><li><b>Positioning statement</b> — for [audience] who [need], [brand] is the [frame of reference] that [point of difference], because [reasons to believe].</li></ul>`],
  ['Distinctive brand assets', `<p>Research on how brands grow (Byron Sharp, Jenni Romaniuk, Ehrenberg-Bass Institute) shows that recognition is built through <b>distinctive assets</b> — colours, shapes, characters, sounds, taglines and patterns that people link to one brand.</p><ul><li>Score each asset on <b>fame</b> (how many people link it to you) and <b>uniqueness</b> (how few link it to competitors).</li><li>Pick a small set and use them relentlessly. Changing assets frequently resets recognition.</li><li>Colour plus shape is the fastest-building combination; a consistent tagline and sonic cue extend reach.</li></ul>`],
  ['Logo standards', `<ul><li><b>Five tests</b>: simple, memorable, timeless, versatile, appropriate.</li><li><b>System</b>: primary, horizontal, stacked, symbol, wordmark, monochrome, reversed, favicon/app icon, optional animated mark.</li><li><b>Clear space</b>: define it with a unit of the mark (for example the cap height), never in fixed pixels.</li><li><b>Minimum size</b>: specify for screen (px) and print (mm). Create a simplified symbol for 16–32 px.</li><li><b>Files</b>: vector master (SVG, PDF, AI/EPS) plus PNG at 1×/2×/3× with transparency; CMYK and Pantone versions for print.</li><li><b>Misuse list</b>: no stretching, recolouring, effects, rotation, outlines, re-typesetting, or placing on busy images without a holding shape.</li></ul>`],
  ['Colour standards', `<ul><li><b>Roles</b>: one primary, one or two secondaries, one accent, neutrals, plus semantic colours (success, warning, error).</li><li><b>60-30-10</b>: about 60% neutral base, 30% primary, 10% accent for actions.</li><li><b>Accessibility (WCAG 2.2)</b>: 4.5:1 for body text, 3:1 for large text (≥24 px, or ≥18.66 px bold) and for UI components; 7:1 for AAA.</li><li><b>Specs</b>: every colour needs HEX, RGB, CMYK and a Pantone reference, plus a tint scale (50–950) for UI.</li><li><b>Psychology</b>: colour meanings depend on culture and category. Use them as a starting hypothesis, not a rule.</li><li><b>Dark mode</b>: define dark-surface variants; pure brand colours often need lifting in dark UI.</li></ul>`],
  ['Typography standards', `<ul><li>One or two families. Use weight, size and spacing for hierarchy before adding typefaces.</li><li>Define a type scale (display, H1–H6, body, caption) with sizes, line heights and tracking for web, mobile and print.</li><li>Body text: 16–18 px on screen, line height 1.4–1.6, 45–75 characters per line.</li><li>Check licences for web, app, broadcast and print. Keep free fallbacks (Google Fonts) for teams and tools.</li><li>Match personality: high-contrast serifs feel heritage and luxury; geometric and grotesque sans feel modern and technical; rounded faces feel friendly.</li></ul>`],
  ['Design principles from Apple’s Human Interface Guidelines', `<p>Since the Liquid Glass redesign introduced at WWDC 2025, Apple’s Human Interface Guidelines are organised around three principles that transfer well to brand systems:</p><ul><li><b>Hierarchy</b> — make what matters most unmistakable. In branding: one message per frame, one hero per layout.</li><li><b>Harmony</b> — elements feel designed together, aligned with their context (device, medium, environment).</li><li><b>Consistency</b> — familiar patterns behave the same everywhere, which builds trust and reduces effort.</li></ul><p>Lessons from Apple’s marketing craft: the product is the hero; generous whitespace; very few words; relentless consistency in typography and photography; strict logo protection with clear-space and minimum-size rules.</p>`],
  ['Physical product branding', `<ul><li><b>Packaging architecture</b>: master brand vs. product name vs. variant, with colour-coding by range.</li><li><b>Information hierarchy</b>: brand → product → key benefit → variant → legal and regulatory details.</li><li><b>Print production</b>: CMYK, 300 dpi, 3 mm bleed, 3–5 mm safe zone, Pantone spot colours for brand-critical hues, proof physically before mass print.</li><li><b>Finishes</b>: foil, emboss/deboss, spot UV, soft-touch — use one hero finish, not all.</li><li><b>Apparel trims</b>: woven neck label, care label, hang tag, branded polybag or mailer, tissue, thank-you card.</li><li><b>Unboxing</b>: design the sequence of reveals; it is the most-shared brand moment for D2C brands.</li></ul>`],

  ['Voice and tone', `<ul><li>Voice is constant; tone flexes by situation (launch, support, apology, sales).</li><li>Write 3–5 principles as “We are X, not Y”, with examples.</li><li>Maintain a vocabulary list: words you own and words you avoid.</li><li>Test copy for clarity first, personality second.</li></ul>`],

function registerSW() {

      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('A new version of Marque is ready', { label: 'Reload', fn: () => { App._wantReload = true; nw.postMessage({ type: 'SKIP_WAITING' }); } });
      });
    });
    setInterval(() => reg.update().catch(() => { }), 60 * 60 * 1000);
  }).catch(() => { /* PWA features unavailable; app still works */ });
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (App._wantReload) { App._wantReload = false; location.reload(); } });
